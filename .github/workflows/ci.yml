name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Rust CLI
        run: cargo test
      - name: Build Rust CLI
        run: cargo build --release
      - name: CLI smoke test
        run: |
          ./target/release/fiveorm init --framework vrpex
          ./target/release/fiveorm validate
          test -f schema.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows CLI
        run: cargo build --release
