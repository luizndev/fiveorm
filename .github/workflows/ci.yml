name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate Linux installer syntax
        run: sh -n install.sh
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Test Rust CLI
        run: cargo test
      - name: Build Rust CLI
        run: cargo build --release
      - name: CLI smoke test
        run: |
          ./target/release/fiveorm init --framework vrpex
          ./target/release/fiveorm validate
          test -f schema.yml
      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: fiveorm-linux-x86_64
          path: target/release/fiveorm
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows CLI
        run: cargo build --release
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: fiveorm-windows-x86_64
          path: target/release/fiveorm.exe
          if-no-files-found: error
