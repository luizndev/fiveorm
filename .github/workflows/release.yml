name: Publish FiveORM release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install static linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Build Linux static binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package Linux binary
        run: tar -czf fiveorm-linux-x86_64.tar.gz -C target/x86_64-unknown-linux-musl/release fiveorm
      - uses: actions/upload-artifact@v4
        with:
          name: fiveorm-linux-release
          path: fiveorm-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows CLI
        run: cargo build --release
      - name: Package Windows binary
        shell: pwsh
        run: Compress-Archive -Path 'target/release/fiveorm.exe' -DestinationPath 'fiveorm-windows-x86_64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: fiveorm-windows-release
          path: fiveorm-windows-x86_64.zip
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fiveorm-*-release
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum fiveorm-linux-x86_64.tar.gz fiveorm-windows-x86_64.zip > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/fiveorm-linux-x86_64.tar.gz
            dist/fiveorm-windows-x86_64.zip
            dist/SHA256SUMS
