[package]
name = "fiveorm"
version = "0.1.0"
edition = "2021"
description = "FiveORM - database tooling for FiveM"
repository = "https://github.com/luizndev/fiveorm"

[[bin]]
name = "fiveorm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
